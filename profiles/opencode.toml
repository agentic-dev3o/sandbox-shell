# OpenCode profile
# Provides access to OpenCode configuration and cache directories
network_mode = "online"

[filesystem]
allow_read = [
    # Custom open code
    "~/.local/share/opencode",
    "~/.local/state/opencode",
    "~/.config/opencode",
    "~/.cache/opencode",
]

allow_write = [
    # Open code
    "~/.config/opencode",
    "~/.local/share/opencode",
    "~/.local/state/opencode",
    "~/.cache/opencode",
]

[shell]
# No additional environment variables needed
pass_env = []

# macOS keeps per-session temp dirs outside /tmp; on Linux the base profile
# already covers /tmp.
[platform.macos.filesystem]
allow_read = ["/private/tmp/.*"]
allow_write = ["/private/tmp/.*"]
allow_list_dirs = ["/private/tmp"]
