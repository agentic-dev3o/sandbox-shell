name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # sx has two sandbox backends (Seatbelt on macOS, Landlock on Linux), so both
  # platforms are first-class in CI.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Report sandbox capabilities
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cat /sys/kernel/security/lsm 2>/dev/null || echo "securityfs not mounted"
            echo "max_user_namespaces=$(cat /proc/sys/user/max_user_namespaces 2>/dev/null)"
          fi
      - name: Run tests
        run: cargo test --verbose

  lint:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        # --all-targets so tests and benches are linted too, not just the crate.
        run: cargo clippy --all-targets -- -D warnings

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Build release
        run: cargo build --release --verbose

  # End-to-end check that the sandbox actually denies what it claims.
  security-behaviour:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run security verification
        env:
          SX_SKIP_TEST_SUITE: "1" # covered by the `test` job
        run: bash scripts/test-security.sh

  # SCA: Dependency vulnerability scanning
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo-audit
        uses: actions/cache@v5
        id: cache-audit
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.21
      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit --deny warnings

  # Secrets scanning
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # License and supply chain compliance
  dependency-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo-deny
        uses: actions/cache@v5
        id: cache-deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.18
      - name: Install cargo-deny
        if: steps.cache-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked
      - name: Check dependencies
        run: cargo deny check
